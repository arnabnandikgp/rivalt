[package]
name = "default-plan-selection"
version = "0.1.0"
edition = "2021"
publish = false

[features]
compact-book = ["dep:clearing-accounting"]
native-search = ["compact-book", "dep:num-bigint", "dep:num-integer", "dep:num-traits"]

[dependencies]
clearing-accounting = { path = "../clearing-accounting", features = ["surviving-profit"], optional = true }
num-bigint = { version = "=0.4.6", default-features = false, optional = true }
num-integer = { version = "=0.1.46", default-features = false, optional = true }
num-traits = { version = "=0.2.19", default-features = false, optional = true }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
serde_json = "=1.0.154"

[[example]]
name = "multi_lot_audit"
required-features = ["native-search"]
