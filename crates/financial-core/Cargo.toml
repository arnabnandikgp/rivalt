[package]
name = "financial-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clearing-accounting = { path = "../clearing-accounting" }
risk-engine = { path = "../risk-engine" }

[lib]
path = "src/lib.rs"

[lints.rust]
# Solana platform-tools adds this target OS to its patched Rust compiler.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }


[features]
parallel-market-prototype = []
closed-quantity-model = ["clearing-accounting/closed-quantity-model"]
# Explicitly meter the vector-backed reference on a local diagnostic SBF only.
sbf-settlement-measurement = []

[[example]]
name = "gross_capacity_replay"
required-features = ["parallel-market-prototype"]

[[test]]
name = "closed_quantity_payout"
required-features = ["closed-quantity-model"]

[[example]]
name = "funding_prefix_replay"
required-features = ["parallel-market-prototype"]
