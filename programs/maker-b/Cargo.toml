[package]
name = "maker_b"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "maker_b"

[features]
default = []
devnet-test-profile = ["clearing/devnet-test-profile"]
successor-test-profile = ["clearing/successor-test-profile"]
account-trading-qualification = ["clearing/account-trading-qualification"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "maker-interface/idl-build", "clearing/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
maker-interface = { path = "../../crates/maker-interface" }

clearing = { path = "../clearing", features = ["no-entrypoint"] }
