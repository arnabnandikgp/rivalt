[workspace]
members = ["programs/clearing"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
