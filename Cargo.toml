[workspace]
members = ["programs/clearing", "crates/financial-core", "crates/maker-interface", "programs/maker-a", "programs/maker-b", "tests/fixtures/hostile-maker", "tests/fixtures/oracle"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Every route authenticates the complete maker ProgramData bytes. Optimize the
# small pricing programs for size; retain checked arithmetic and fat LTO.
[profile.release.package.maker_a]
opt-level = "z"

[profile.release.package.maker_b]
opt-level = "z"
