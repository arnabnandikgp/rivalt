[workspace]
members = ["programs/clearing", "crates/financial-core", "crates/maker-interface", "programs/maker-a", "programs/maker-b"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
