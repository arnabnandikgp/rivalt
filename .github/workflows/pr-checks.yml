name: Scoped PR checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'apps/**'
      - 'packages/**'
      - 'crates/**'
      - 'programs/**'
      - 'tests/**'
      - 'ops/**'
      - 'scenarios/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'tsconfig.json'
permissions:
  contents: read
concurrency:
  group: scoped-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client: ${{ steps.scope.outputs.client }}
      financial: ${{ steps.scope.outputs.financial }}
      report: ${{ steps.scope.outputs.report }}
      shell: ${{ steps.scope.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep raw evidence out of the tracked tree
        run: python3 ops/check-evidence-policy.py
      - name: Preserve the pinned wire contract
        run: python3 ops/wire_contract.py
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 ops/ci-scope.py
  client:
    needs: scope
    if: needs.scope.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - run: npm install --global pnpm@10.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tests/anchor-conformance install --frozen-lockfile
      - run: node ops/local-keys.mjs
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Canonical maker SDK against independent reference
        run: python3 tests/financial/check_maker_curve_parity.py --implementation sdk
      - name: Exact liquidity allocation against independent financial enumeration
        run: python3 tests/financial/check_liquidity_allocation.py
      - run: pnpm build:trader
  report:
    needs: scope
    if: needs.scope.outputs.report == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 --version
      - run: python3 -m unittest discover -s tests/e2e -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/load -p 'test_*.py'
  financial:
    needs: scope
    if: needs.scope.outputs.financial == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: mkdir -p .local
      - run: bash ops/financial.sh
      - name: Current engine and disabled-default gates
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --locked -p clearing --lib --features liquidity-execution-qualification
          cargo test --locked -p clearing --lib
          cargo test --locked -p maker_a -p maker_b --lib --features maker-liquidity-qualification
          cargo test --locked -p maker_a -p maker_b --lib

  shell:
    needs: scope
    if: needs.scope.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: for script in ops/*.sh; do bash -n "$script"; done
